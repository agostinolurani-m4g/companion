# HMR Companion — produzione su VPS (~4€/mese es. Hetzner CX22)
#
# Variabili d'app (INGEST_TOKEN, GOOGLE_MAPS_API_KEY, MAPILLARY_ACCESS_TOKEN,
# NEXT_PUBLIC_WINDY_API_KEY, …): un solo file `.env` in QUESTA cartella (deploy/),
# solo sul server — non in git. Il servizio `hmr` lo carica con `env_file`.
#
# Compose legge lo stesso `.env` per `${VAR}` nel YAML (es. build args e Caddy).

services:
  hmr:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Stesso nome nel `.env`: serve al `npm run build` (bundle client Next).
        NEXT_PUBLIC_WINDY_API_KEY: ${NEXT_PUBLIC_WINDY_API_KEY:-}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3002"
      HOSTNAME: 0.0.0.0
      HMR_DB_PATH: /data/hmr.db
      # Fail-fast: stesso valore che hai già in `.env` (Compose lo sostituisce da lì).
      INGEST_TOKEN: ${INGEST_TOKEN:?set INGEST_TOKEN in .env}
    volumes:
      - hmr_db:/data
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3002/api/track/default"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      HMR_DOMAIN: ${HMR_DOMAIN:?set HMR_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hmr

volumes:
  hmr_db:
  caddy_data:
  caddy_config:
